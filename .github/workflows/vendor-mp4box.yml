name: Vendor MP4Box locally

on:
  push:
    paths:
      - ".github/workflows/vendor-mp4box.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download legacy MP4Box build and license
        run: |
          mkdir -p vendor
          curl --fail --location --retry 3 \
            https://cdn.jsdelivr.net/npm/mp4box-vg@0.3.16-vg2/dist/mp4box.all.min.js \
            --output vendor/mp4box.all.min.js
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/gpac/mp4box.js/v0.3.16/LICENSE \
            --output vendor/MP4BOX-LICENSE.txt
          test -s vendor/mp4box.all.min.js
          grep -q "MP4Box" vendor/mp4box.all.min.js

      - name: Commit vendored files safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/mp4box.all.min.js vendor/MP4BOX-LICENSE.txt
          if git diff --cached --quiet; then
            echo "Vendored legacy MP4Box is already current."
            exit 0
          fi
          git diff --cached --binary > /tmp/vendor.patch
          git reset --hard HEAD
          git fetch origin main
          git checkout -B main origin/main
          git apply --index /tmp/vendor.patch
          if git diff --cached --quiet; then
            echo "Vendored MP4Box became current after refreshing main."
            exit 0
          fi
          git commit -m "Vendor legacy MP4Box 0.3.16 for Chromecast 3"
          git push origin HEAD:main
